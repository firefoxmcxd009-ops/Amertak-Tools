<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="pageTitle">Image to URL Converter - Amertak Tools</title>
    <meta name="description" id="pageDesc" content="Convert images into shareable URLs with preview on social media. Upload JPG, PNG, or WEBP and share directly on Facebook, Twitter, and more.">
    <meta name="keywords" content="image to url, image sharing, social media preview, jpg to url, png to url, webp to url, Amertak Tools">
    <link rel="canonical" href="https://amertak.tools/tools/image-to-url/">
    
    <!-- Open Graph Tags (Dynamic) -->
    <meta property="og:type" id="ogType" content="website">
    <meta property="og:title" id="ogTitle" content="Image to URL Converter - Amertak Tools">
    <meta property="og:description" id="ogDesc" content="Convert images into shareable URLs with preview on social media.">
    <meta property="og:url" id="ogUrl" content="https://amertak.tools/tools/image-to-url/">
    <meta property="og:image" id="ogImage" content="https://amertak.tools/svg/logo.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:site_name" content="Amertak Tools">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" id="twitterTitle" content="Image to URL Converter - Amertak Tools">
    <meta name="twitter:description" id="twitterDesc" content="Convert images into shareable URLs with preview on social media.">
    <meta name="twitter:image" id="twitterImage" content="https://amertak.tools/svg/logo.png">
    
    <link rel="icon" type="image/png" href="/svg/logo.png">
    <link rel="shortcut icon" href="/svg/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/theme.css">
    <link rel="stylesheet" href="/assets/css/header.css">
    <link rel="stylesheet" href="/assets/css/sidebar.css">
    <link rel="stylesheet" href="/assets/css/footer.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/tools/image-to-url/style.css">
</head>
<body>

    <!-- BACKGROUND ANIMATED -->
    <div id="bg-animated"></div>
    
    <div id="overlay" class="overlay hidden"></div>
    <aside id="sidebar" class="sidebar-mobile"></aside>

    <!-- Main Content Wrapper -->
    <div class="app-wrapper">
        <header id="header"></header>

        <main class="url-page">
            <section class="url-hero">
                <div>
                    <p class="eyebrow">Amertak Tools</p>
                    <h1>Image to URL</h1>
                    <p class="subtitle">Share images on social media with preview banners</p>
                </div>
            </section>

            <section class="url-workspace">
                <article class="url-panel">
                    <div class="panel-heading">
                        <span class="panel-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M5 4H15V8H19V20H5V4ZM3 2.9918V21.0082C3 21.5447 3.44476 22 3.9934 22H20.0066C20.5551 22 21 21.5489 21 20.9925L20.9997 7L16 2H3.9985C3.44749 2 3 2.44405 3 2.9918ZM7 14L10 11L12 13L15 10L17 12V18H7V14Z"></path></svg>
                        </span>
                        <div>
                            <h2>Upload Image</h2>
                            <p>JPG, PNG, WEBP</p>
                        </div>
                    </div>

                    <label id="dropZone" class="drop-zone" for="imageInput">
                        <input id="imageInput" type="file" accept="image/*" single>
                        <span class="drop-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M3 19H21V21H3V19ZM13 5.82843V17H11V5.82843L5.63604 11.1924L4.22183 9.77817L12 2L19.7782 9.77817L18.364 11.1924L13 5.82843Z"></path></svg>
                        </span>
                        <strong>Drop image here</strong>
                        <small>or click to choose file</small>
                    </label>

                    <div class="image-settings">
                        <label>
                            Image Description (for social media preview)
                            <textarea id="imageDesc" placeholder="Enter a description for your image" maxlength="160"></textarea>
                            <small><span id="descCount">0</span>/160 characters</small>
                        </label>
                    </div>

                    <div class="action-row">
                        <button id="createUrlBtn" class="primary-btn" type="button" disabled>Create URL</button>
                        <button id="clearBtn" class="ghost-btn" type="button" disabled>Clear</button>
                    </div>
                    <div id="loader" class="loader" style="display:none;">
                        <span class="loader-spin"></span>
                        <span>Creating share link…</span>
                    </div>
                    <p id="statusText" class="status-text">Waiting for image</p>
                </article>

                <article class="url-panel">
                    <div class="panel-heading">
                        <span class="panel-icon preview-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 18.5C7 18.5 2.73 15.39 1 11C2.73 6.61 7 3.5 12 3.5C17 3.5 21.27 6.61 23 11C21.27 15.39 17 18.5 12 18.5ZM12 16.5C15.73 16.5 19.02 14.43 20.57 11C19.02 7.57 15.73 5.5 12 5.5C8.27 5.5 4.98 7.57 3.43 11C4.98 14.43 8.27 16.5 12 16.5ZM12 14C10.34 14 9 12.66 9 11C9 9.34 10.34 8 12 8C13.66 8 15 9.34 15 11C15 12.66 13.66 14 12 14Z"></path></svg>
                        </span>
                        <div>
                            <h2>Preview & Share</h2>
                            <p id="previewStatus">No image selected</p>
                        </div>
                    </div>
                    <div class="preview-container">
                        <div id="previewImage" class="preview-image-box">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 18.5C7 18.5 2.73 15.39 1 11C2.73 6.61 7 3.5 12 3.5C17 3.5 21.27 6.61 23 11C21.27 15.39 17 18.5 12 18.5ZM12 16.5C15.73 16.5 19.02 14.43 20.57 11C19.02 7.57 15.73 5.5 12 5.5C8.27 5.5 4.98 7.57 3.43 11C4.98 14.43 8.27 16.5 12 16.5ZM12 14C10.34 14 9 12.66 9 11C9 9.34 10.34 8 12 8C13.66 8 15 9.34 15 11C15 12.66 13.66 14 12 14Z"></path></svg>
                        </div>
                        <div id="urlResult" class="url-result" style="display:none;">
                            <div class="url-box">
                                <input type="text" id="urlOutput" readonly>
                                <button id="copyUrlBtn" class="copy-btn">Copy</button>
                            </div>
                            <div class="share-buttons">
                                <button id="shareTwitter" class="share-btn twitter" title="Share on Twitter">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M22.162 5.656a4.576 4.576 0 0 1-1.343 1.453c.686 10.395-5.76 17.75-15.404 17.75-3.064 0-5.907-.994-8.334-2.652.462.036.932.054 1.404.054 2.55 0 4.934-.87 6.238-2.65.58-1.022.578-2.5.173-3.528-1.122-.177-2.196-.828-2.893-1.772-.339-.521-.619-1.13-.798-1.772 1.335.048 2.652.333 3.734 1.052 1.193.816 2.049 2.023 2.581 3.328.032-.191.06-.382.088-.572.506-3.566-1.313-6.80-5.308-8.988 2.383.49 4.099 1.633 5.23 3.285 1.052-1.545 1.685-3.28 1.685-5.159 0-.686-.123-1.35-.36-1.954 2.922 4.555 4.588 10.207 1.784 15.737a4.988 4.988 0 0 1 2.568-1.36c.513-2.467-.97-4.92-2.868-6.02z"></path></svg>
                                </button>
                                <button id="shareFacebook" class="share-btn facebook" title="Share on Facebook">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"></path></svg>
                                </button>
                                <button id="shareLinkedin" class="share-btn linkedin" title="Share on LinkedIn">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.475-2.236-1.986-2.236-1.081 0-1.722.722-2.004 1.418-.103.249-.129.597-.129.946v5.441h-3.554s.05-8.83 0-9.748h3.554v1.383c.43-.665 1.199-1.61 2.923-1.61 2.134 0 3.734 1.39 3.734 4.38v5.595zM5.337 5.433c-1.144 0-1.915-.761-1.915-1.71 0-.951.769-1.71 1.959-1.71 1.19 0 1.913.759 1.93 1.71 0 .949-.74 1.71-1.974 1.71zm1.575 15.019H3.762V6.704h3.15v13.748zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"></path></svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </article>
            </section>
        </main>
        
        <footer id="footer"></footer>
    </div>

    <script src="/assets/js/nav-data.js"></script>
    <script src="/assets/js/header.js"></script>
    <script src="/assets/js/sidebar.js"></script>
    <script src="/assets/js/app.js"></script>
    <script src="/assets/js/footer.js"></script>
    <script src="/tools/image-to-url/app.js"></script>
</body>
</html>
