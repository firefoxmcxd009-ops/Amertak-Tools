services:
  - type: web
    name: amertak-tools-api
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        sync: false
      - key: MONGOURL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGIN
        value: https://amertak-tools.vercel.app,https://tools-amertak.vercel.app,https://amertak.tools
      - key: STORAGE_PROVIDER
        value: local
      - key: MAX_UPLOAD_SIZE_MB
        value: 100
