<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR Code Generator - Amertak Tools</title>
    <meta name="description" content="Generate QR codes from text or URLs and scan QR code images.">
    <link rel="canonical" href="https://amertak.tools/tools/qr-code/">
    <meta name="keywords" content="QR code generator, create QR code, QR code online, free QR code, Amertak Tools">
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="QR Code Generator - Amertak Tools">
    <meta property="og:description" content="Generate QR codes from text or URLs. Customize size and download instantly.">
    <meta property="og:url" content="https://amertak.tools/tools/qr-code/">
    <meta property="og:image" content="https://amertak.tools/svg/logo.svg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:site_name" content="Amertak Tools">
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="QR Code Generator - Amertak Tools">
    <meta name="twitter:description" content="Generate QR codes from text or URLs. Customize size and download instantly.">
    <meta name="twitter:image" content="https://amertak.tools/svg/logo.svg">
    <link rel="icon" type="image/png" href="/svg/logo.svg">
    <link rel="shortcut icon" href="/svg/logo.svg">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/theme.css">
    <link rel="stylesheet" href="/assets/css/header.css">
    <link rel="stylesheet" href="/assets/css/sidebar.css">
    <link rel="stylesheet" href="/assets/css/footer.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/tools/qr-code/style.css">
    
</head>
<body>

    <!-- BACKGROUND ANIMATED -->
    <div id="bg-animated"></div>

    <div id="overlay" class="overlay hidden"></div>
    <aside id="sidebar" class="sidebar-mobile"></aside>

    <!-- Main Content Wrapper -->
    <div class="app-wrapper">
        <header id="header"></header>

        <main class="qr-page">
            <section class="qr-hero">
                <div>
                    <p class="eyebrow">Amertak Tools</p>
                    <h1>QR Code Generator</h1>
                </div>
                <a class="back-link" href="/">Back Home</a>
            </section>

            <section class="qr-workspace" aria-label="QR code workspace">
                <article class="qr-panel">
                    <div class="panel-heading">
                        <span class="panel-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M16 17V16H13V13H16V15H18V17H17V19H15V21H13V18H15V17H16ZM21 21H17V19H19V17H21V21ZM3 3H11V11H3V3ZM5 5V9H9V5H5ZM13 3H21V11H13V3ZM15 5V9H19V5H15ZM3 13H11V21H3V13ZM5 15V19H9V15H5ZM18 13H21V15H18V13ZM6 6H8V8H6ZM6 16H8V18H6ZM16 6H18V8H16Z"></path></svg>
                        </span>
                        <div>
                            <h2>Create QR</h2>
                            <p>Text or URL to QR image</p>
                        </div>
                    </div>

                    <label class="field-label" for="qrText">Content</label>
                    <textarea id="qrText" rows="8" placeholder="Paste a URL or type text"></textarea>

                    <div class="control-grid">
                        <label>
                            Size
                            <input id="qrSize" type="number" min="160" max="800" step="20" value="280">
                        </label>
                        <label>
                            Margin
                            <input id="qrMargin" type="number" min="0" max="8" step="1" value="2">
                        </label>
                    </div>

                    <div class="action-row">
                        <button id="generateBtn" class="primary-btn" type="button">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M5 3H19C19.5523 3 20 3.44772 20 4V20C20 20.5523 19.5523 21 19 21H5C4.44772 21 4 20.5523 4 20V4C4 3.44772 4.44772 3 5 3ZM6 5V19H18V5H6ZM8 7H11V10H8V7ZM13 7H16V10H13V7ZM8 12H11V15H8V12ZM13 12H14.5V13.5H16V15H14.5V16.5H13V15H11.5V13.5H13V12Z"></path></svg>
                            Generate
                        </button>
                        <button id="clearBtn" class="ghost-btn" type="button">Clear</button>
                    </div>
                </article>

                <article class="qr-panel preview-panel">
                    <div class="panel-heading">
                        <span class="panel-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M13 10H20L11 23V14H4L13 1V10Z"></path></svg>
                        </span>
                        <div>
                            <h2>Preview</h2>
                            <p>PNG ready for download</p>
                        </div>
                    </div>

                    <div class="qr-preview">
                        <img id="qrPreviewImage" alt="Generated QR code preview">
                        <p id="qrStatus" class="status-text">Ready</p>
                    </div>

                    <div class="action-row">
                        <button id="downloadBtn" class="primary-btn" type="button" disabled>
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M13 10H18L12 16L6 10H11V3H13V10ZM4 19H20V12H22V20C22 20.5523 21.5523 21 21 21H3C2.44772 21 2 20.5523 2 20V12H4V19Z"></path></svg>
                            Download
                        </button>
                        <button id="copyBtn" class="ghost-btn" type="button" disabled>Copy PNG</button>
                    </div>
                </article>

                <article class="qr-panel scanner-panel">
                    <div class="panel-heading">
                        <span class="panel-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M4 4H10V6H6V10H4V4ZM14 4H20V10H18V6H14V4ZM18 14H20V20H14V18H18V14ZM6 14V18H10V20H4V14H6ZM8 8H16V16H8V8ZM10 10V14H14V10H10Z"></path></svg>
                        </span>
                        <div>
                            <h2>Scan Image</h2>
                            <p>Drop QR image here</p>
                        </div>
                    </div>

                    <label id="dropZone" class="drop-zone" for="qrImage">
                        <input id="qrImage" type="file" accept="image/png,image/jpeg,image/gif">
                        <span class="drop-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M3 19H21V21H3V19ZM13 5.82843V17H11V5.82843L5.63604 11.1924L4.22183 9.77817L12 2L19.7782 9.77817L18.364 11.1924L13 5.82843Z"></path></svg>
                        </span>
                        <strong>Drag and drop QR image</strong>
                        <small>PNG, JPG, GIF under 1 MB</small>
                    </label>

                    <div id="scanPreview" class="scan-preview hidden"></div>
                    <label class="field-label" for="scanResult">Result</label>
                    <textarea id="scanResult" rows="5" readonly placeholder="Decoded text will appear here"></textarea>
                    <div class="action-row">
                        <button id="copyScanBtn" class="primary-btn" type="button" disabled>Copy Result</button>
                        <button id="openResultBtn" class="ghost-btn" type="button" disabled>Open URL</button>
                    </div>
                    <p id="scanStatus" class="status-text">Waiting for image</p>
                </article>
            </section>
        </main>
        
        <footer id="footer"></footer>
    </div>

    <script src="/tools/tool-auth.js"></script>
    <script src="/assets/js/nav-data.js"></script>
    <script src="/assets/js/header.js"></script>
    <script src="/assets/js/sidebar.js"></script>
    <script src="/assets/js/footer.js"></script>
    <script src="/assets/js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.0/build/qrcode.min.js"></script>
    <script src="/tools/qr-code/app.js"></script>

    <!-- BACKGROUND ANIMATION -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.globe.min.js"></script>

    <script>
    VANTA.GLOBE({
        el: "#bg-animated",
        size: 1,
        mouseControls: true,
        touchControls: true,
        gyroControls: true,

        backgroundColor: 0x050b11,
        color: 0xff3f81,
        color2: 0xffffff,

        minHeight: 100.00,
        minWidth: 100.00,
        scale: 1.00,
        scaleMobile: 1.00
    });
    </script>
    
</body>
</html>
