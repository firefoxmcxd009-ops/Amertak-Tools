<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Image to PDF Converter - Amertak Tools</title>
    <meta name="description" content="Convert JPG, PNG, and WEBP images into a PDF file directly in your browser with Amertak Tools.">
    <meta name="keywords" content="image to pdf, jpg to pdf, png to pdf, webp to pdf, photo to pdf, convert image to pdf, Amertak Tools">
    <link rel="canonical" href="https://amertak.tools/tools/image-to-pdf/">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Image to PDF Converter - Amertak Tools">
    <meta property="og:description" content="Convert images into a PDF file from your browser.">
    <meta property="og:url" content="https://amertak.tools/tools/image-to-pdf/">
    <meta property="og:image" content="https://amertak.tools/svg/logo.png">
    <meta property="og:site_name" content="Amertak Tools">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Image to PDF Converter - Amertak Tools">
    <meta name="twitter:description" content="Convert JPG, PNG, and WEBP images into PDF files.">
    <meta name="twitter:image" content="https://amertak.tools/svg/logo.png">
    <link rel="icon" type="image/png" href="/svg/logo.png">
    <link rel="shortcut icon" href="/svg/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/theme.css">
    <link rel="stylesheet" href="/assets/css/header.css">
    <link rel="stylesheet" href="/assets/css/sidebar.css">
    <link rel="stylesheet" href="/assets/css/footer.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/tools/image-to-pdf/style.css">
    
</head>
<body>

    <!-- BACKGROUND ANIMATED -->
    <div id="bg-animated"></div>

    <div id="overlay" class="overlay hidden"></div>
    <aside id="sidebar" class="sidebar-mobile"></aside>

    <!-- Main Content Wrapper -->
    <div class="app-wrapper">
        <header id="header"></header>

        <main class="pdf-page">
            <section class="pdf-hero">
                <div>
                    <p class="eyebrow">Amertak Tools</p>
                    <h1>Image to PDF</h1>
                </div>
            </section>

            <section class="pdf-workspace">
                <article class="pdf-panel">
                    <div class="panel-heading">
                        <span class="panel-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M5 4H15V8H19V20H5V4ZM3 2.9918V21.0082C3 21.5447 3.44476 22 3.9934 22H20.0066C20.5551 22 21 21.5489 21 20.9925L20.9997 7L16 2H3.9985C3.44749 2 3 2.44405 3 2.9918ZM7 14L10 11L12 13L15 10L17 12V18H7V14Z"></path></svg>
                        </span>
                        <div>
                            <h2>Upload Images</h2>
                            <p>JPG, PNG, WEBP, GIF</p>
                        </div>
                    </div>

                    <label id="dropZone" class="drop-zone" for="imageInput">
                        <input id="imageInput" type="file" accept="image/*" multiple>
                        <span class="drop-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M3 19H21V21H3V19ZM13 5.82843V17H11V5.82843L5.63604 11.1924L4.22183 9.77817L12 2L19.7782 9.77817L18.364 11.1924L13 5.82843Z"></path></svg>
                        </span>
                        <strong>Drop images here</strong>
                        <small>or click to choose files</small>
                    </label>

                    <div class="settings-grid">
                        <label>
                            Page Size
                            <select id="pageSize">
                                <option value="a4">A4</option>
                                <option value="letter">Letter</option>
                            </select>
                        </label>
                        <label>
                            Orientation
                            <select id="orientation">
                                <option value="portrait">Portrait</option>
                                <option value="landscape">Landscape</option>
                            </select>
                        </label>
                        <label>
                            Image Fit
                            <select id="imageFit">
                                <option value="contain">Fit Page</option>
                                <option value="cover">Fill Page</option>
                            </select>
                        </label>
                        <label>
                            Margin
                            <input id="pageMargin" type="number" min="0" max="40" step="2" value="10">
                        </label>
                    </div>

                    <div class="action-row">
                        <button id="createPdfBtn" class="primary-btn" type="button" disabled>Create PDF</button>
                        <button id="clearBtn" class="ghost-btn" type="button" disabled>Clear</button>
                    </div>
                    <p id="statusText" class="status-text">Waiting for images</p>
                </article>

                <article class="pdf-panel">
                    <div class="panel-heading">
                        <span class="panel-icon preview-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 18.5C7 18.5 2.73 15.39 1 11C2.73 6.61 7 3.5 12 3.5C17 3.5 21.27 6.61 23 11C21.27 15.39 17 18.5 12 18.5ZM12 16.5C15.73 16.5 19.02 14.43 20.57 11C19.02 7.57 15.73 5.5 12 5.5C8.27 5.5 4.98 7.57 3.43 11C4.98 14.43 8.27 16.5 12 16.5ZM12 14C10.34 14 9 12.66 9 11C9 9.34 10.34 8 12 8C13.66 8 15 9.34 15 11C15 12.66 13.66 14 12 14Z"></path></svg>
                        </span>
                        <div>
                            <h2>Preview</h2>
                            <p id="fileCount">No images selected</p>
                        </div>
                    </div>
                    <div id="previewList" class="preview-list"></div>
                </article>
            </section>
        </main>
        
        <footer id="footer"></footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="/tools/tool-auth.js"></script>
    <script src="/assets/js/nav-data.js"></script>
    <script src="/assets/js/header.js"></script>
    <script src="/assets/js/sidebar.js"></script>
    <script src="/assets/js/footer.js"></script>
    <script src="/assets/js/app.js"></script>
    <script src="/tools/image-to-pdf/app.js"></script>

    <!-- BACKGROUND ANIMATION -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.globe.min.js"></script>

    <script>
    VANTA.GLOBE({
        el: "#bg-animated",
        size: 1,
        mouseControls: true,
        touchControls: true,
        gyroControls: true,

        backgroundColor: 0x050b11,
        color: 0xff3f81,
        color2: 0xffffff,

        minHeight: 100.00,
        minWidth: 100.00,
        scale: 1.00,
        scaleMobile: 1.00
    });
    </script>
    
</body>
</html>
