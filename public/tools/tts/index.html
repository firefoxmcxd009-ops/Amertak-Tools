<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ស្តាប់សំឡេង — Khmer TTS Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/theme.css">
    <link rel="stylesheet" href="/assets/css/header.css">
    <link rel="stylesheet" href="/assets/css/sidebar.css">
    <link rel="stylesheet" href="/assets/css/footer.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/analytics.css">
    <link rel="stylesheet" href="/tools/tts/style.css">
</head>
<body>

    <!-- Mobile Sidebar Drawer (Hidden on Desktop) -->
    <div id="overlay" class="overlay hidden"></div>
    <aside id="sidebar" class="sidebar-mobile"></aside>
    <header id="header"></header>

<div class="wrap">
  <h2>សំឡេង អេអាយ - AI Speech</h2>
  <p class="sub-title">amertak <strong>text to speech</strong></p>
<!--//
  <div class="motif"></div>
\\-->
  <div class="panel">

    <label for="text-input">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="25" height="25" fill="currentColor"><path d="M14.5 5H6C4.89543 5 4 5.89543 4 7V17C4 18.1046 4.89543 19 6 19H18C19.1046 19 20 18.1046 20 17V14.5H22V17C22 19.2091 20.2091 21 18 21H6C3.79086 21 2 19.2091 2 17V7C2 4.79086 3.79086 3 6 3H14.5V5ZM14 11H11V17H9V11H6V9H14V11ZM20.6572 1.34277C22.1049 2.79049 23 4.79086 23 7C23 9.20914 22.1049 11.2095 20.6572 12.6572L19.2422 11.2422C20.328 10.1564 21 8.65685 21 7C21 5.34315 20.328 3.8436 19.2422 2.75781L20.6572 1.34277ZM17.8281 4.17188C18.552 4.89573 19 5.89543 19 7C19 8.10457 18.552 9.10427 17.8281 9.82812L16.4141 8.41406C16.776 8.05213 17 7.55228 17 7C17 6.44772 16.776 5.94787 16.4141 5.58594L17.8281 4.17188Z"></path></svg>
      <span>អត្ថបទ</span>
    </label>
    <textarea id="text-input" maxlength="2000" placeholder="វាយបញ្ចូលអត្ថបទ..."></textarea>
    <div class="field-row">
      <div class="hint">អតិបរមា ២.០០០ តួអក្សរ</div>
      <div class="counter" id="counter">0 / 2000</div>
    </div>

    <div class="chips" id="chips">
      <button type="button" class="chip">សួស្តី អ្នកទាំងអស់គ្នា ហាហាហា</button>
      <button type="button" class="chip">សូមស្វាគមន៍មកកាន់ អមតៈ​  ដែលអាចប្រើមុខងារច្រើនដោយហ្រ្វី។</button>
    </div>

    <div class="row">
      <div class="field">
        <label>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M20.4668 7.69379L20.7134 7.12811C21.1529 6.11947 21.9445 5.31641 22.9323 4.87708L23.6919 4.53922C24.1027 4.35653 24.1027 3.75881 23.6919 3.57612L22.9748 3.25714C21.9616 2.80651 21.1558 1.97373 20.7238 0.930828L20.4706 0.319534C20.2942 -0.106511 19.7058 -0.106511 19.5293 0.319534L19.2761 0.930828C18.8442 1.97373 18.0384 2.80651 17.0252 3.25714L16.308 3.57612C15.8973 3.75881 15.8973 4.35653 16.308 4.53922L17.0677 4.87708C18.0555 5.31641 18.8471 6.11947 19.2866 7.12811L19.5331 7.69379C19.7136 8.10792 20.2864 8.10792 20.4668 7.69379ZM3.05469 11H5.07065C5.55588 14.3923 8.47329 17 11.9998 17C15.5262 17 18.4436 14.3923 18.9289 11H20.9448C20.4837 15.1716 17.1714 18.4839 12.9998 18.9451V23H10.9998V18.9451C6.82814 18.4839 3.51584 15.1716 3.05469 11ZM12 1C9.23858 1 7 3.23858 7 6V10C7 12.7614 9.23858 15 12 15C14.7614 15 17 12.7614 17 10V7H15V10C15 11.6569 13.6569 13 12 13C10.3431 13 9 11.6569 9 10V6C9 4.34315 10.3431 3 12 3C12.5972 3 13.1509 3.17349 13.617 3.47248L14.6969 1.7891C13.9182 1.28957 12.9914 1 12 1Z"></path></svg>
          <span>សំឡេង</span>
        </label>
        <div class="voice-toggle" role="group" aria-label="Voice selection">
          <button type="button" class="voice-btn" data-voice="km-KH-PisethNeural" aria-pressed="true">
            <span class="km-name">សំឡេងប្រុស</span>
          </button>
          <button type="button" class="voice-btn" data-voice="km-KH-SreymomNeural" aria-pressed="false">
            <span class="km-name">សំឡេងស្រី</span>
          </button>
        </div>
      </div>
    </div>

    <!-- HIDDEN -->
    <div class="row" style="display: none;">
      <div class="field">
        <label for="base-url">API Base URL</label>
        <input type="text" id="base-url" placeholder="http://localhost:3000">
        <div class="hint">Requests go to <code>{base}/api/tts</code>. Leave blank if this page is served from the same API.</div>
      </div>
    </div>

    <button type="button" class="generate" id="generate-btn">
      <span class="spinner"></span>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="25" height="25" fill="currentColor"><path d="M10.6144 17.7956C10.277 18.5682 9.20776 18.5682 8.8704 17.7956L7.99275 15.7854C7.21171 13.9966 5.80589 12.5726 4.0523 11.7942L1.63658 10.7219C.868536 10.381.868537 9.26368 1.63658 8.92276L3.97685 7.88394C5.77553 7.08552 7.20657 5.60881 7.97427 3.75892L8.8633 1.61673C9.19319.821767 10.2916.821765 10.6215 1.61673L11.5105 3.75894C12.2782 5.60881 13.7092 7.08552 15.5079 7.88394L17.8482 8.92276C18.6162 9.26368 18.6162 10.381 17.8482 10.7219L15.4325 11.7942C13.6789 12.5726 12.2731 13.9966 11.492 15.7854L10.6144 17.7956ZM4.53956 9.82234C6.8254 10.837 8.68402 12.5048 9.74238 14.7996 10.8008 12.5048 12.6594 10.837 14.9452 9.82234 12.6321 8.79557 10.7676 7.04647 9.74239 4.71088 8.71719 7.04648 6.85267 8.79557 4.53956 9.82234ZM19.4014 22.6899 19.6482 22.1242C20.0882 21.1156 20.8807 20.3125 21.8695 19.8732L22.6299 19.5353C23.0412 19.3526 23.0412 18.7549 22.6299 18.5722L21.9121 18.2532C20.8978 17.8026 20.0911 16.9698 19.6586 15.9269L19.4052 15.3156C19.2285 14.8896 18.6395 14.8896 18.4628 15.3156L18.2094 15.9269C17.777 16.9698 16.9703 17.8026 15.956 18.2532L15.2381 18.5722C14.8269 18.7549 14.8269 19.3526 15.2381 19.5353L15.9985 19.8732C16.9874 20.3125 17.7798 21.1156 18.2198 22.1242L18.4667 22.6899C18.6473 23.104 19.2207 23.104 19.4014 22.6899ZM18.3745 19.0469 18.937 18.4883 19.4878 19.0469 18.937 19.5898 18.3745 19.0469Z"></path></svg>
      <span class="gen-label">បង្កើតសំឡេង</span>
    </button>

    <div class="status" id="status"></div>

    <div class="player" id="player">
      <div class="player-head">
        <span class="player-title">Waveform</span>
        <span class="player-meta" id="voice-meta">—</span>
      </div>

      <div class="wave-shell">
        <canvas id="wave" width="1200" height="192" aria-label="Audio waveform, click to seek"></canvas>
        <div class="time-row">
          <span id="time-current">0:00</span>
          <span id="time-total">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button type="button" class="play-btn" id="play-btn" aria-label="Play">
          <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg id="pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>

        <div class="action-btns">
          <button type="button" class="icon-btn" id="download-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 19h16"/></svg>
            Download
          </button>
          <button type="button" class="icon-btn" id="share-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.1M8.2 13.2l7.6 4.1"/></svg>
            Share
          </button>
        </div>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<audio id="audio-el" style="display:none;"></audio>

<footer id="footer"></footer>

<script src="/tools/tts/app.js"></script>
<script src="/assets/js/app.js"></script>
<script src="/assets/js/sidebar.js"></script>
<script src="/assets/js/header.js"></script>
<script src="/assets/js/footer.js"></script>
<script src="/assets/js/nav-data.js"></script>
<script src="/assets/js/s"></script>

</body>
</html>
