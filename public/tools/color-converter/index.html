<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>បម្លែងពណ៌​ (កូដ) - Amertak Tools</title>
    <meta name="description" content="Convert HEX colors to RGB, HSL, and HSV with a live preview.">
    <link rel="canonical" href="https://amertak.tools/tools/color-converter/">
    <meta name="keywords" content="color converter, hex to rgb, hex to hsl, color picker, Amertak Tools">
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Color Converter - Amertak Tools">
    <meta property="og:description" content="Convert HEX colors to RGB, HSL, and HSV with live preview. Free online color converter.">
    <meta property="og:url" content="https://amertak.tools/tools/color-converter/">
    <meta property="og:image" content="https://amertak.tools/svg/logo.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:site_name" content="Amertak Tools">
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Color Converter - Amertak Tools">
    <meta name="twitter:description" content="Convert HEX colors to RGB, HSL, and HSV with live preview. Free online color converter.">
    <meta name="twitter:image" content="https://amertak.tools/svg/logo.png">
    <link rel="icon" type="image/png" href="/svg/logo.png">
    <link rel="shortcut icon" href="/svg/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/theme.css">
    <link rel="stylesheet" href="/assets/css/header.css">
    <link rel="stylesheet" href="/assets/css/sidebar.css">
    <link rel="stylesheet" href="/assets/css/footer.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/tools/tool-page.css">
</head>
<body>

    <!-- BACKGROUND ANIMATED -->
    <div id="bg-animated"></div>

    <!-- Mobile Sidebar Drawer (Hidden on Desktop) -->
    <div id="overlay" class="overlay hidden"></div>
    <aside id="sidebar" class="sidebar-mobile"></aside>

    <div class="app-wrapper">
        <header id="header"></header>

        <main class="utility-page">
            <section class="utility-hero">
                <div>
                    <p class="eyebrow">Amertak Tools</p>
                    <h1>បម្លែងពណ៌​ (កូដ)</h1>
                    <p class="utility-copy">Convert HEX values to RGB, HSL, and HSV.</p>
                </div>
                <a class="back-link" href="/">Back Home</a>
            </section>

            <section class="utility-workspace">
                <article class="utility-panel">
                    <div class="panel-heading">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 2C17.52 2 22 6.48 22 12C22 16.42 18.42 20 14 20H12.5C11.67 20 11 20.67 11 21.5C11 21.78 10.78 22 10.5 22C5.81 22 2 18.19 2 13.5V12C2 6.48 6.48 2 12 2ZM7.5 12C8.33 12 9 11.33 9 10.5C9 9.67 8.33 9 7.5 9C6.67 9 6 9.67 6 10.5C6 11.33 6.67 12 7.5 12ZM10.5 8C11.33 8 12 7.33 12 6.5C12 5.67 11.33 5 10.5 5C9.67 5 9 5.67 9 6.5C9 7.33 9.67 8 10.5 8ZM15.5 8C16.33 8 17 7.33 17 6.5C17 5.67 16.33 5 15.5 5C14.67 5 14 5.67 14 6.5C14 7.33 14.67 8 15.5 8ZM17.5 12C18.33 12 19 11.33 19 10.5C19 9.67 18.33 9 17.5 9C16.67 9 16 9.67 16 10.5C16 11.33 16.67 12 17.5 12Z"></path></svg>
                        <div>
                            <h2>Input</h2>
                            <p>Use HEX, RGB, or the native color picker.</p>
                        </div>
                    </div>

                    <div class="settings-grid">
                        <label>
                            HEX
                            <input id="hexInput" type="text" value="#ff2a5d" placeholder="#ff2a5d">
                        </label>
                        <label>
                            Color
                            <input id="colorInput" type="color" value="#ff2a5d">
                        </label>
                    </div>

                    <div class="action-row">
                        <button id="copyBtn" class="primary-btn" type="button">Copy HEX</button>
                        <button id="randomBtn" class="ghost-btn" type="button">Random</button>
                    </div>
                    <p id="statusText" class="status-text">Ready.</p>
                </article>

                <article class="utility-panel">
                    <div id="colorPreview" class="color-preview"></div>
                    <div class="metric-grid" style="margin-top: 16px;">
                        <div class="metric-card"><strong id="hexOut">#ff2a5d</strong>HEX</div>
                        <div class="metric-card"><strong id="rgbOut">rgb(255, 42, 93)</strong>RGB</div>
                        <div class="metric-card"><strong id="hslOut">hsl(345, 100%, 58%)</strong>HSL</div>
                        <div class="metric-card"><strong id="hsvOut">hsv(346, 84%, 100%)</strong>HSV</div>
                    </div>
                </article>
            </section>
        </main>

        <footer id="footer"></footer>
    </div>

    <script src="/tools/tool-auth.js"></script>
    <script src="/assets/js/nav-data.js"></script>
    <script src="/assets/js/header.js"></script>
    <script src="/assets/js/sidebar.js"></script>
    <script src="/assets/js/footer.js"></script>
    <script src="/assets/js/app.js"></script>
    <script src="/tools/color-converter/app.js"></script>

    <!-- BACKGROUND ANIMATION -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.globe.min.js"></script>

    <script>
    VANTA.GLOBE({
        el: "#bg-animated",
        size: 1,
        mouseControls: true,
        touchControls: true,
        gyroControls: true,

        backgroundColor: 0x050b11,
        color: 0xff3f81,
        color2: 0xffffff,

        minHeight: 100.00,
        minWidth: 100.00,
        scale: 1.00,
        scaleMobile: 1.00
    });
    </script>
</body>
</html>
