<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Infinite Slider</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f4f4f5;
  font-family: Arial, sans-serif;
}


</style>
</head>
<body>

<div class="slider">
  <button class="prev">‹</button>

  <div class="wrapper">
    <div class="track" id="track">
      <!-- Images -->
      <div class="card"><img src="image1.jpg" alt="Slide 1"></div>
      <div class="card"><img src="image2.jpg" alt="Slide 2"></div>
      <div class="card"><img src="image3.jpg" alt="Slide 3"></div>
      <div class="card"><img src="image4.jpg" alt="Slide 4"></div>
      <div class="card"><img src="image5.jpg" alt="Slide 5"></div>
    </div>
  </div>

  <button class="next">›</button>
</div>

<script>
const track = document.getElementById("track");
let cards = document.querySelectorAll(".card");
let index = 0;
let auto;

function visible() {
  if (innerWidth <= 600) return 1;
  if (innerWidth <= 900) return 2;
  return 3;
}

function setupClone() {
  let count = visible();
  cards = document.querySelectorAll(".card");
  for (let i = 0; i < count; i++) {
    let clone = cards[i].cloneNode(true);
    track.appendChild(clone);
  }
}

setupClone();
cards = document.querySelectorAll(".card");

function move() {
  let width = cards[0].offsetWidth + 20;
  track.style.transform = `translateX(-${index * width}px)`;
}

function next() {
  index++;
  track.style.transition = ".5s ease";
  move();

  let max = cards.length - visible();
  if (index >= max) {
    setTimeout(() => {
      track.style.transition = "none";
      index = 0;
      move();
    }, 500);
  }
}

function prev() {
  if (index <= 0) {
    track.style.transition = "none";
    index = cards.length - visible() - 1;
    move();
    setTimeout(() => {
      track.style.transition = ".5s ease";
      index--;
      move();
    }, 20);
  } else {
    index--;
    move();
  }
}

document.querySelector(".next").onclick = () => {
  next();
  restart();
};

document.querySelector(".prev").onclick = () => {
  prev();
  restart();
};

function start() {
  auto = setInterval(() => {
    next();
  }, 3000);
}

function restart() {
  clearInterval(auto);
  setTimeout(() => {
    start();
  }, 5000);
}

start();

window.onresize = () => {
  location.reload();
};
</script>

</body>
</html>
