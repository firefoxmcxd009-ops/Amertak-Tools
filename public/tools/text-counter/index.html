<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Text Counter - Amertak Tools</title>
    <meta name="description" content="Count characters, words, sentences, paragraphs, and reading time in your browser.">
    <link rel="canonical" href="https://amertak.tools/tools/text-counter/">
    <meta name="keywords" content="text counter, word counter, character count, reading time, Amertak Tools">
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Text Counter - Amertak Tools">
    <meta property="og:description" content="Count characters, words, sentences, paragraphs, and reading time instantly in your browser.">
    <meta property="og:url" content="https://amertak.tools/tools/text-counter/">
    <meta property="og:image" content="https://amertak.tools/svg/logo.svg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:site_name" content="Amertak Tools">
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Text Counter - Amertak Tools">
    <meta name="twitter:description" content="Count characters, words, sentences, paragraphs, and reading time instantly in your browser.">
    <meta name="twitter:image" content="https://amertak.tools/svg/logo.svg">
    <link rel="icon" type="image/png" href="/svg/logo.svg">
    <link rel="shortcut icon" href="/svg/logo.svg">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/theme.css">
    <link rel="stylesheet" href="/assets/css/header.css">
    <link rel="stylesheet" href="/assets/css/sidebar.css">
    <link rel="stylesheet" href="/assets/css/footer.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/tools/tool-page.css">
</head>
<body>

    <!-- BACKGROUND ANIMATED -->
    <div id="bg-animated"></div>

    <!-- Mobile Sidebar Drawer (Hidden on Desktop) -->
    <div id="overlay" class="overlay hidden"></div>
    <aside id="sidebar" class="sidebar-mobile"></aside>
    
    <div class="app-wrapper">
        <header id="header"></header>

        <main class="utility-page">
            <section class="utility-hero">
                <div>
                    <p class="eyebrow">Amertak Tools</p>
                    <h1>Text Counter</h1>
                    <p class="utility-copy">Paste text and get live writing metrics.</p>
                </div>
                <a class="back-link" href="/">Back Home</a>
            </section>

            <section class="utility-workspace">
                <article class="utility-panel">
                    <div class="panel-heading">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M8.5 6H6.5V18H8.5V6ZM4 10H2V14H4V10ZM13 2H11V22H13V2ZM17.5 8H15.5V18H17.5V8ZM22 10H20V14H22V10Z"></path></svg>
                        <div>
                            <h2>Input</h2>
                            <p>Words, characters, paragraphs, and reading time update instantly.</p>
                        </div>
                    </div>
                    <textarea id="inputText" placeholder="Paste or type text here..."></textarea>
                    <div class="action-row">
                        <button id="copyBtn" class="primary-btn" type="button" disabled>Copy</button>
                        <button id="clearBtn" class="ghost-btn" type="button">Clear</button>
                    </div>
                </article>

                <article class="utility-panel">
                    <div class="panel-heading">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M5 3H19V21H5V3ZM7 5V19H17V5H7ZM9 7H15V9H9V7ZM9 11H15V13H9V11ZM9 15H13V17H9V15Z"></path></svg>
                        <div>
                            <h2>Stats</h2>
                            <p id="statusText">Ready.</p>
                        </div>
                    </div>
                    <div class="metric-grid">
                        <div class="metric-card"><strong id="wordCount">0</strong>Words</div>
                        <div class="metric-card"><strong id="charCount">0</strong>Characters</div>
                        <div class="metric-card"><strong id="sentenceCount">0</strong>Sentences</div>
                        <div class="metric-card"><strong id="paragraphCount">0</strong>Paragraphs</div>
                        <div class="metric-card"><strong id="readingTime">0m</strong>Reading</div>
                        <div class="metric-card"><strong id="lineCount">0</strong>Lines</div>
                    </div>
                </article>
            </section>
        </main>

        
        <footer id="footer"></footer>

    </div>

    <script src="/tools/tool-auth.js"></script>
    <script src="/assets/js/nav-data.js"></script>
    <script src="/assets/js/header.js"></script>
    <script src="/assets/js/sidebar.js"></script>
    <script src="/assets/js/footer.js"></script>
    <script src="/assets/js/app.js"></script>
    
    
    <script src="/tools/text-counter/app.js"></script>

    <!-- BACKGROUND ANIMATION -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.globe.min.js"></script>

    <script>
    VANTA.GLOBE({
        el: "#bg-animated",
        size: 1,
        mouseControls: true,
        touchControls: true,
        gyroControls: true,

        backgroundColor: 0x050b11,
        color: 0xff3f81,
        color2: 0xffffff,

        minHeight: 100.00,
        minWidth: 100.00,
        scale: 1.00,
        scaleMobile: 1.00
    });
    </script>
</body>
</html>
