<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR Code Generator - Amertak Tools</title>
    <meta name="description" content="Generate QR codes from text or URLs and scan QR code images.">
    <link rel="canonical" href="https://amertak.tools/tools/qr-code/">
    <meta name="keywords" content="QR code generator, create QR code, QR code online, free QR code, Amertak Tools">
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="QR Code Generator - Amertak Tools">
    <meta property="og:description" content="Generate QR codes from text or URLs. Customize size and download instantly.">
    <meta property="og:url" content="https://amertak.tools/tools/qr-code/">
    <meta property="og:image" content="https://amertak.tools/svg/logo.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:site_name" content="Amertak Tools">
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="QR Code Generator - Amertak Tools">
    <meta name="twitter:description" content="Generate QR codes from text or URLs. Customize size and download instantly.">
    <meta name="twitter:image" content="https://amertak.tools/svg/logo.png">
    <link rel="icon" type="image/png" href="/svg/logo.png">
    <link rel="shortcut icon" href="/svg/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/theme.css">
    <link rel="stylesheet" href="/assets/css/header.css">
    <link rel="stylesheet" href="/assets/css/sidebar.css">
    <link rel="stylesheet" href="/assets/css/footer.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/tools/qr-code/style.css">
    
</head>
<body>

    <!-- BACKGROUND ANIMATED -->
    <div id="particle-container">
        <canvas id="particle-canvas"></canvas>
    </div>

    <div id="overlay" class="overlay hidden"></div>
    <aside id="sidebar" class="sidebar-mobile"></aside>

    <!-- Main Content Wrapper -->
    <div class="app-wrapper">
        <header id="header"></header>

        <main class="qr-page">
            <section class="qr-hero">
                <div>
                    <p class="eyebrow">Amertak Tools</p>
                    <h1>QR Code Generator</h1>
                </div>
            </section>

            <section class="qr-workspace" aria-label="QR code workspace">
                <article class="qr-panel">
                    <div class="panel-heading">
                        <span class="panel-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M16 17V16H13V13H16V15H18V17H17V19H15V21H13V18H15V17H16ZM21 21H17V19H19V17H21V21ZM3 3H11V11H3V3ZM5 5V9H9V5H5ZM13 3H21V11H13V3ZM15 5V9H19V5H15ZM3 13H11V21H3V13ZM5 15V19H9V15H5ZM18 13H21V15H18V13ZM6 6H8V8H6ZM6 16H8V18H6ZM16 6H18V8H16Z"></path></svg>
                        </span>
                        <div>
                            <h2>បង្កើត Qr Code</h2>
                            <p>វាយបញ្ចូលអក្សរ ឬតំណលីងដើម្បីបង្កើត</p>
                        </div>
                    </div>

                    <label class="field-label" for="qrText">សូមបញ្ចូលនៅទីនេះ</label>
                    <textarea id="qrText" rows="8" placeholder="បិតភ្ជាប់តំណលីង ឬវាយបញ្ចូលអក្សរ..."></textarea>

                    <!-- HIDDEN -->
                    <div class="control-grid" style="display: none;">
                        <label>
                            Size
                            <input id="qrSize" type="number" min="160" max="800" step="20" value="280">
                        </label>
                        <label>
                            Margin
                            <input id="qrMargin" type="number" min="0" max="8" step="1" value="0">
                        </label>
                    </div>

                    <div class="action-row">
                        <button id="generateBtn" class="primary-btn" type="button">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M16 17V16H13V13H16V15H18V17H17V19H15V21H13V18H15V17H16ZM21 21H17V19H19V17H21V21ZM3 3H11V11H3V3ZM5 5V9H9V5H5ZM13 3H21V11H13V3ZM15 5V9H19V5H15ZM3 13H11V21H3V13ZM5 15V19H9V15H5ZM18 13H21V15H18V13ZM6 6H8V8H6V6ZM6 16H8V18H6V16ZM16 6H18V8H16V6Z"></path></svg>
                            បង្កើត Qr
                        </button>
                        <button id="clearBtn" class="ghost-btn" type="button">សម្អាត</button>
                    </div>
                </article>

                <article class="qr-panel preview-panel">
                    <div class="panel-heading">
                        <span class="panel-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M13 10H20L11 23V14H4L13 1V10Z"></path></svg>
                        </span>
                        <div>
                            <h2>លទ្ធផល</h2>
                            <p>នឹងត្រូវបានបង្កើតជាហ្វាល់ png</p>
                        </div>
                    </div>

                    <div class="qr-preview">
                        <img id="qrPreviewImage" alt="Generated QR code preview">
                        <p id="qrStatus" class="status-text">Ready</p>
                    </div>

                    <div class="action-row">
                        <button id="downloadBtn" class="primary-btn" type="button" disabled>
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12.4142 5H21C21.5523 5 22 5.44772 22 6V20C22 20.5523 21.5523 21 21 21H3C2.44772 21 2 20.5523 2 20V4C2 3.44772 2.44772 3 3 3H10.4142L12.4142 5ZM4 5V19H20V7H11.5858L9.58579 5H4ZM13 13H16L12 17L8 13H11V9H13V13Z"></path></svg>
                            <span>ទាញយក</span>
                        </button>
                        <button id="copyBtn" class="ghost-btn" type="button" disabled>
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M6.9998 6V3C6.9998 2.44772 7.44752 2 7.9998 2H19.9998C20.5521 2 20.9998 2.44772 20.9998 3V17C20.9998 17.5523 20.5521 18 19.9998 18H16.9998V20.9991C16.9998 21.5519 16.5499 22 15.993 22H4.00666C3.45059 22 3 21.5554 3 20.9991L3.0026 7.00087C3.0027 6.44811 3.45264 6 4.00942 6H6.9998ZM5.00242 8L5.00019 20H14.9998V8H5.00242ZM8.9998 6H16.9998V16H18.9998V4H8.9998V6ZM7 11H13V13H7V11ZM7 15H13V17H7V15Z"></path></svg>
                            <span>ចម្លង Qr</span>
                        </button>
                        <button id="shareBtn" class="ghost-btn" type="button" disabled>
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M13.1202 17.0228L8.92129 14.7324C8.19135 15.5125 7.15261 16 6 16C3.79086 16 2 14.2091 2 12C2 9.79086 3.79086 8 6 8C7.15255 8 8.19125 8.48746 8.92118 9.26746L13.1202 6.97713C13.0417 6.66441 13 6.33707 13 6C13 3.79086 14.7909 2 17 2C19.2091 2 21 3.79086 21 6C21 8.20914 19.2091 10 17 10C15.8474 10 14.8087 9.51251 14.0787 8.73246L9.87977 11.0228C9.9583 11.3355 10 11.6629 10 12C10 12.3371 9.95831 12.6644 9.87981 12.9771L14.0788 15.2675C14.8087 14.4875 15.8474 14 17 14C19.2091 14 21 15.7909 21 18C21 20.2091 19.2091 22 17 22C14.7909 22 13 20.2091 13 18C13 17.6629 13.0417 17.3355 13.1202 17.0228ZM6 14C7.10457 14 8 13.1046 8 12C8 10.8954 7.10457 10 6 10C4.89543 10 4 10.8954 4 12C4 13.1046 4.89543 14 6 14ZM17 8C18.1046 8 19 7.10457 19 6C19 4.89543 18.1046 4 17 4C15.8954 4 15 4.89543 15 6C15 7.10457 15.8954 8 17 8ZM17 20C18.1046 20 19 19.1046 19 18C19 16.8954 18.1046 16 17 16C15.8954 16 15 16.8954 15 18C15 19.1046 15.8954 20 17 20Z"></path></svg>
                            <span>ចែករំលែក</span>
                        </button>
                    </div>
                </article>

                <article class="qr-panel scanner-panel">
                    <div class="panel-heading">
                        <span class="panel-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M4 4H10V6H6V10H4V4ZM14 4H20V10H18V6H14V4ZM18 14H20V20H14V18H18V14ZM6 14V18H10V20H4V14H6ZM8 8H16V16H8V8ZM10 10V14H14V10H10Z"></path></svg>
                        </span>
                        <div>
                            <h2>ស្គែន Qr code</h2>
                            <p>អាប់ឡូតរូបភាព Qr</p>
                        </div>
                    </div>

                    <label id="dropZone" class="drop-zone" for="qrImage">
                        <input id="qrImage" type="file" accept="image/png,image/jpeg,image/gif">
                        <span class="drop-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M3 19H21V21H3V19ZM13 5.82843V17H11V5.82843L5.63604 11.1924L4.22183 9.77817L12 2L19.7782 9.77817L18.364 11.1924L13 5.82843Z"></path></svg>
                        </span>
                        <strong>Drag and drop QR image</strong>
                        <small>PNG, JPG, GIF under 1 MB</small>
                    </label>

                    <div id="scanPreview" class="scan-preview hidden"></div>
                    <label class="field-label" for="scanResult">លទ្ធផល</label>
                    <textarea id="scanResult" rows="5" readonly placeholder="បន្ទាប់ពីស្គែន លទ្ធផលនឹងបង្ហាញ..."></textarea>
                    <div class="action-row">
                        <button id="copyScanBtn" class="primary-btn" type="button" disabled>ចម្លងលទ្ធផល</button>
                        <button id="openResultBtn" class="ghost-btn" type="button" disabled>បើកតំណលីង</button>
                    </div>
                    <p id="scanStatus" class="status-text">Waiting for image</p>
                </article>
            </section>
        </main>
        
        <footer id="footer"></footer>
    </div>

    <script src="/tools/tool-auth.js"></script>
    <script src="/assets/js/nav-data.js"></script>
    <script src="/assets/js/header.js"></script>
    <script src="/assets/js/sidebar.js"></script>
    <script src="/assets/js/footer.js"></script>
    <script src="/assets/js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.0/build/qrcode.min.js"></script>
    <script src="/tools/qr-code/app.js"></script>

    <!-- BACKGROUND ANIMATION -->
    <script src="/assets/js/particle.js"></script>
    
</body>
</html>
