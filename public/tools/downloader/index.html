<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video Downloader - Amertak Tools</title>

    <meta name="description" content="Download videos and audio from TikTok, Instagram, YouTube, Facebook, Twitter/X, Pinterest, Reddit, Vimeo, Dailymotion, SoundCloud and more.">
    <meta name="keywords" content="video downloader, tiktok downloader, instagram downloader, youtube downloader, facebook video download, Amertak Tools">
    <link rel="canonical" href="https://amertak.tools/tools/downloader/">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/svg/logo.svg">
    <link rel="shortcut icon" href="/svg/logo.svg">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Video Downloader - Amertak Tools">
    <meta property="og:description" content="Download videos and audio from TikTok, Instagram, YouTube, Facebook, Twitter/X, Pinterest, Reddit, Vimeo, and more.">
    <meta property="og:image" content="https://amertak.tools/svg/logo.svg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:url" content="https://amertak.tools/tools/downloader/">
    <meta property="og:site_name" content="Amertak Tools">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Video Downloader - Amertak Tools">
    <meta name="twitter:description" content="Download videos from TikTok, Instagram, YouTube, Facebook and more.">
    <meta name="twitter:image" content="https://amertak.tools/svg/logo.svg">
    
    <!-- External Resources -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Share+Tech&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/theme.css">
    <link rel="stylesheet" href="/assets/css/header.css">
    <link rel="stylesheet" href="/assets/css/sidebar.css">
    <link rel="stylesheet" href="/assets/css/footer.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/tools/downloader/style.css">
    
</head>
<body>

    <!-- BACKGROUND ANIMATED -->
    <div id="bg-animated"></div>

    <!-- Mobile Sidebar Drawer (Hidden on Desktop) -->
    <div id="overlay" class="overlay hidden"></div>
    <aside id="sidebar" class="sidebar-mobile"></aside>

    <!-- Main Content Wrapper -->
    <div class="app-wrapper">
        <header id="header"></header>

        <main class="main-content">
            <div class="content-container">
                <!-- Dynamic Page Header -->
                <section class="page-header">
                    <div class="header-titles">
                        <h2 id="mainTitle" data-aos="zoom-up" data-aos-delay="100"><strong>Downloader</strong></h2>
                    </div>
                </section>
                
                
                <div class=" id=">
                    <div class="range" id="range">
                        <div class="range__label" id="range_label"></div>
                    </div>
                </div>
        </main>
        <!-- Tools Container -->
        <div class="main">
            <div class="input-section">
                <div class="input-group">
                    <input type="url" class="url-input" placeholder="Paste video URL here (TikTok, Instagram, etc.)" required>
                    <button class="download-btn" id="fetchBtn">
                        <span>Fetch URL</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" viewBox="0 0 24 24" fill="#fff"><path d="M13 10H18L12 16L6 10H11V3H13V10ZM4 19H20V12H22V20C22 20.5523 21.5523 21 21 21H3C2.44772 21 2 20.5523 2 20V12H4V19Z"></path></svg>
                    </button>
                </div>
            </div>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Fetching video information...</p>
            </div>
            
            <div class="error-message" id="errorMessage"></div>
            
            <div class="results-section" id="resultsSection">
                <div class="video-info">
                    <h2 class="video-title" id="videoTitle"></h2>
                    <div class="video-author" id="videoAuthor"></div>
                    <div class="thumbnail-container">
                        <img class="video-thumbnail" id="videoThumbnail" src="" alt="Video Thumbnail">
                    </div>
                </div>
                
                <div class="download-options">
                    <h3>Download Options</h3>
                    <div id="downloadOptions"></div>
                </div>
            </div>
            
            <div class="supported-platforms">
                <h4 class="platforms-title"><strong>Supported Platforms</strong></h4>
                <div class="platform-icons">
                    <div class="platform-icon">TikTok</div>
                    <div class="platform-icon">Instagram</div>
                    <div class="platform-icon">YouTube</div>
                    <div class="platform-icon">Facebook</div>
                    <div class="platform-icon">Twitter</div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer id="footer"></footer>
    </div>

    <script src="/tools/tool-auth.js"></script>
    <script src="/assets/js/nav-data.js"></script>
    <script src="/assets/js/header.js"></script>
    <script src="/assets/js/sidebar.js"></script>
    <script src="/assets/js/footer.js"></script>
    <script src="/assets/js/app.js"></script>
    <script src="/tools/downloader/app.js"></script>
    
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script>
        AOS.init({
            duration: 600,
            once: false
        });
    </script>

    <!-- BACKGROUND ANIMATION -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.globe.min.js"></script>

    <script>
    VANTA.GLOBE({
        el: "#bg-animated",
        size: 1,
        mouseControls: true,
        touchControls: true,
        gyroControls: true,

        backgroundColor: 0x050b11,
        color: 0xff3f81,
        color2: 0xffffff,

        minHeight: 100.00,
        minWidth: 100.00,
        scale: 1.00,
        scaleMobile: 1.00
    });
    </script>
</body>
</html>
