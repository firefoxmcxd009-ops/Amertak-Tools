<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video & Audio Transcribe - Amertak Tools</title>
    <meta name="description" content="Transcribe speech while playing video or audio and export captions as SRT or VTT.">
    <link rel="canonical" href="https://amertak.tools/tools/video-audio-transcribe/">
    <meta name="keywords" content="audio transcription, video transcription, speech to text, SRT caption, Amertak Tools">
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Video & Audio Transcribe - Amertak Tools">
    <meta property="og:description" content="Transcribe speech from video and audio files using AI. Export captions as SRT or VTT.">
    <meta property="og:url" content="https://amertak.tools/tools/video-audio-transcribe/">
    <meta property="og:image" content="https://amertak.tools/svg/logo.svg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:site_name" content="Amertak Tools">
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Video & Audio Transcribe - Amertak Tools">
    <meta name="twitter:description" content="Transcribe speech from video and audio files using AI. Export captions as SRT or VTT.">
    <meta name="twitter:image" content="https://amertak.tools/svg/logo.svg">
    <link rel="icon" type="image/png" href="/svg/logo.svg">
    <link rel="shortcut icon" href="/svg/logo.svg">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/theme.css">
    <link rel="stylesheet" href="/assets/css/header.css">
    <link rel="stylesheet" href="/assets/css/sidebar.css">
    <link rel="stylesheet" href="/assets/css/footer.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/tools/tool-page.css">
</head>
<body>

    <!-- BACKGROUND ANIMATED -->
    <div id="bg-animated"></div>

    <!-- Mobile Sidebar Drawer (Hidden on Desktop) -->
    <div id="overlay" class="overlay hidden"></div>
    <aside id="sidebar" class="sidebar-mobile"></aside>

    <div class="app-wrapper">
        <header id="header"></header>

        <main class="utility-page">
            <section class="utility-hero">
                <div>
                    <p class="eyebrow">Amertak Tools</p>
                    <h1>Video & Audio Transcribe</h1>
                    <p class="utility-copy">Upload media, start speech capture, then export the generated transcript as captions.</p>
                </div>
                <a class="back-link" href="/">Back Home</a>
            </section>

            <section class="utility-workspace">
                <article class="utility-panel">
                    <div class="panel-heading">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M4 4H14C15.1046 4 16 4.89543 16 6V9.17157L20.2929 4.87868C20.9229 4.24871 22 4.69495 22 5.58579V18.4142C22 19.305 20.9229 19.7513 20.2929 19.1213L16 14.8284V18C16 19.1046 15.1046 20 14 20H4C2.89543 20 2 19.1046 2 18V6C2 4.89543 2.89543 4 4 4Z"></path></svg>
                        <div>
                            <h2>Media</h2>
                            <p>Audio and video files stay in your browser.</p>
                        </div>
                    </div>

                    <label class="drop-zone" for="mediaInput">
                        <input id="mediaInput" type="file" accept="audio/*,video/*">
                        <strong>Choose video or audio</strong>
                        <small id="fileName">MP3, WAV, MP4, WEBM, MOV</small>
                    </label>

                    <div class="field-grid" style="margin-top: 16px;">
                        <video id="videoPlayer" controls hidden></video>
                        <audio id="audioPlayer" controls hidden></audio>
                    </div>

                    <div class="settings-grid" style="margin-top: 16px;">
                        <label>
                            Speech Language
                            <select id="speechLang">
                                <option value="km-KH">Khmer</option>
                                <option value="en-US" selected>English</option>
                                <option value="th-TH">Thai</option>
                                <option value="zh-CN">Chinese</option>
                                <option value="ja-JP">Japanese</option>
                                <option value="ko-KR">Korean</option>
                            </select>
                        </label>
                        <label>
                            Export Format
                            <select id="captionFormat">
                                <option value="srt">SRT</option>
                                <option value="vtt">VTT</option>
                            </select>
                        </label>
                    </div>

                    <div class="action-row">
                        <button id="startBtn" class="primary-btn" type="button">Start Transcribe</button>
                        <button id="stopBtn" class="ghost-btn" type="button" disabled>Stop</button>
                        <button id="clearBtn" class="ghost-btn" type="button">Clear</button>
                    </div>
                    <p id="statusText" class="status-text">Ready.</p>
                </article>

                <article class="utility-panel">
                    <div class="panel-heading">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M21 4V20.0072C21 20.5551 20.5551 21 20.0072 21H3.99281C3.44405 21 3 20.5551 3 20.0072V3.99281C3 3.44405 3.44495 3 3.99281 3H20.0072C20.556 3 21 3.44495 21 4ZM7 7V9H17V7H7ZM7 11V13H17V11H7ZM7 15V17H13V15H7Z"></path></svg>
                        <div>
                            <h2>Transcript & Captions</h2>
                            <p>Edit the transcript before exporting captions.</p>
                        </div>
                    </div>

                    <textarea id="transcriptText" placeholder="Transcript will appear here. You can also paste or edit text manually."></textarea>
                    <div class="action-row">
                        <button id="copyBtn" class="primary-btn" type="button" disabled>Copy Text</button>
                        <button id="downloadBtn" class="ghost-btn" type="button" disabled>Download Captions</button>
                    </div>
                    <div id="captionList" class="caption-list" style="margin-top: 16px;"></div>
                </article>
            </section>
        </main>

        <footer id="footer"></footer>

    </div>

    <script src="/tools/tool-auth.js"></script>
    <script src="/assets/js/nav-data.js"></script>
    <script src="/assets/js/header.js"></script>
    <script src="/assets/js/sidebar.js"></script>
    <script src="/assets/js/footer.js"></script>
    <script src="/assets/js/app.js"></script>
    
    
    <script type="module" src="/tools/video-audio-transcribe/app.js"></script>

    <!-- BACKGROUND ANIMATION -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.globe.min.js"></script>

    <script>
    VANTA.GLOBE({
        el: "#bg-animated",
        size: 1,
        mouseControls: true,
        touchControls: true,
        gyroControls: true,

        backgroundColor: 0x050b11,
        color: 0xff3f81,
        color2: 0xffffff,

        minHeight: 100.00,
        minWidth: 100.00,
        scale: 1.00,
        scaleMobile: 1.00
    });
    </script>
</body>
</html>
